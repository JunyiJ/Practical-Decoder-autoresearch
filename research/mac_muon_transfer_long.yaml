version: 1
purpose: research
name: mac-muon-transfer-long
hypothesis: Controlled mutations of the measured Muon muP baseline improve width64
  final CE and transfer unchanged to widths128/256.
device: mps
data:
  path: data/raw/shakespeare.txt
  train_fraction: 0.8
  val_fraction: 0.1
model:
  n_layers: 2
  head_dim: 32
  dropout: 0.0
  norm_type: rmsnorm
training:
  max_iters: 3000
  batch_size: 8
  block_size: 128
  weight_decay: 6.0e-05
  grad_clip: 1.0
  eval_every: 300
  eval_iters: 30
  cpu_threads: 4
widths:
- 64
- 128
- 256
learning_rates:
- 0.001
- 0.002
- 0.003
baseline_lr: 0.002
screen_seed: 0
seeds:
- 11
- 22
- 33
eval_seed: 2026
min_improvement: 0.005
limits:
  max_trials: 41
  session_seconds: 7200
  trial_seconds: 600
  max_disk_mb: 2048
  max_failures: 4
  max_consecutive_failures: 2
